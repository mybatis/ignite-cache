name: Java CI

on: [workflow_dispatch, push, pull_request]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IGNITE_VERSION: 3.1.0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        cache: [maven]
        distribution: [temurin]
        java: [21, 25, 26]
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
      max-parallel: 6
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java ${{ matrix.java }} ${{ matrix.distribution }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          cache: ${{ matrix.cache }}
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Setup Ignite
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -L -o ignite-db.zip https://dlcdn.apache.org/ignite/${IGNITE_VERSION}/ignite3-db-${IGNITE_VERSION}.zip
          curl -L -o ignite-cli.zip https://dlcdn.apache.org/ignite/${IGNITE_VERSION}/ignite3-cli-${IGNITE_VERSION}.zip
          unzip -q ignite-db.zip
          unzip -q ignite-cli.zip
          mv ignite3-db-3.1.0 ignite-db
          mv ignite3-cli-3.1.0 ignite-cli

          ./ignite-db/bin/ignite3db > ignite.log 2>&1 &
          echo $! > ignite.pid

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:10300/management/v1/node/state >/dev/null; then
              break
            fi
            sleep 2
          done

          ./ignite-cli/bin/ignite3 cluster init --name=mybatis
      - name: Test with Maven
        run: ./mvnw test --batch-mode --no-transfer-progress --show-version -D"license.skip=true"
